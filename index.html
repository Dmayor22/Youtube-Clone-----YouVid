<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouVid</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- header -->
      <header>
        <div class="logo">
          <img src="./images/menu.png" alt="" id="menu" />
          <img src="./images/logo.png" alt="logo" id="app_logo" />
        </div>

        <!-- search -->
        <div class="search">
          <div class="search_details">
            <input type="search" placeholder="search" />
            <img src="./images/search.png" alt="" />
          </div>
          <img src="./images/voice-search.png" alt="" />
        </div>

        <div class="icons">
          <img src="./images/upload.png" alt="" class="icon_img" />
          <img src="./images/more.png" alt="" class="icon_img" />
          <img src="./images/notification.png" alt="" class="icon_img" />
          <img src="./images/Jack.png" alt="" id="profile_img" />
        </div>
      </header>

      <!-- main -->
      <main>
        <!-- sidebar -->
        <aside>
          <div class="top_side">
            <ul>
              <li>
                <div class="top_side_details">
                  <img src="./images/home.png" alt="" />
                  <span>Home</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/explore.png" alt="" />
                  <span>Explore</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/subscriprion.png" alt="" />
                  <span>Subscriprion</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/library.png" alt="" />
                  <span>Library</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/history.png" alt="" />
                  <span>History</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/cast.png" alt="" />
                  <span>Cast Videos</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/playlist.png" alt="" />
                  <span>Playlist</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/messages.png" alt="" />
                  <span>Messages</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/show-more.png" alt="" />
                  <span>Show more</span>
                </div>
              </li>
            </ul>
          </div>
          <hr />
          <div class="top_side subscribed">
            <p>SUBSCRIBED</p>
            <ul>
              <li>
                <div class="top_side_details">
                  <img src="./images/Jack.png" alt="" />
                  <span>Jack Nicholson</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/simon.png" alt="" />
                  <span>Simon Baker</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/tom.png" alt="" />
                  <span>Tom Hardy</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/megan.png" alt="" />
                  <span>Megan Ryan</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/cameron.png" alt="" />
                  <span>Cameron Diaz</span>
                </div>
              </li>
            </ul>
          </div>
        </aside>
        <!-- video content display -->
        <section></section>
      </main>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
