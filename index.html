<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouVid</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div class="container">
      <!-- header -->
      <header>
        <div class="logo">
          <img src="./images/menu.png" alt="" id="menu" />
          <img src="./images/logo.png" alt="logo" id="app_logo" />
        </div>

        <!-- search -->
        <div class="search">
          <div class="search_details">
            <input type="search" placeholder="search" />
            <img src="./images/search.png" alt="" />
          </div>
          <img src="./images/voice-search.png" alt="" />
        </div>

        <div class="icons">
          <img src="./images/upload.png" alt="" class="icon_img" />
          <img src="./images/more.png" alt="" class="icon_img" />
          <img src="./images/notification.png" alt="" class="icon_img" />
          <img src="./images/Jack.png" alt="" id="profile_img" />
        </div>
      </header>

      <!-- main -->
      <main>
        <!-- sidebar -->
        <aside>
          <div class="top_side">
            <ul>
              <li>
                <div class="top_side_details">
                  <img src="./images/home.png" alt="" />
                  <span>Home</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/explore.png" alt="" />
                  <span>Explore</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/subscriprion.png" alt="" />
                  <span>Subscriprion</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/library.png" alt="" />
                  <span>Library</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/history.png" alt="" />
                  <span>History</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/cast.png" alt="" />
                  <span>Cast Videos</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/playlist.png" alt="" />
                  <span>Playlist</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/messages.png" alt="" />
                  <span>Messages</span>
                </div>
              </li>
              <li>
                <div class="top_side_details">
                  <img src="./images/show-more.png" alt="" />
                  <span>Show more</span>
                </div>
              </li>
            </ul>
          </div>
          <hr />
          <div class="subscribed"></div>
        </aside>
        <!-- video content display -->
        <section></section>
      </main>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
