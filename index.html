<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouVid</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div class="container">
      <!-- header -->
      <header>
        <div class="logo">
          <img src="./images/menu.png" alt="" id="menu" />
          <img src="./images/logo.png" alt="logo" id="app_logo" />
        </div>

        <!-- search -->
        <div class="search">
          <div class="search_details">
            <input type="text" placeholder="search" />
            <img src="./images/search.png" alt="" />
          </div>
          <img src="./images/voice-search.png" alt="" />
        </div>

        <div class="icons">
          <img src="./images/upload.png" alt="" class="icon_img" />
          <img src="./images/more.png" alt="" class="icon_img" />
          <img src="./images/notification.png" alt="" class="icon_img" />
          <img src="./images/Jack.png" alt="" id="profile_img" />
        </div>
      </header>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
